sendmail: mail-to-root
	comment Send mails to admin@pam's email address
	disable true
	mailto-user admin@pam

matcher: default-matcher
	comment Route all notifications to smtp
	mode all
	target mail-example

smtp: mail-example
	author Proxmox VE - node1
	comment Send emails by example.org
	from-address server@example.org
	mailto-user admin@pam
	mode tls
	server mail.example.org
	username server@example.org
